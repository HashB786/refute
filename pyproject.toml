[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refute"
version = "0.1.0"
description = "Finds the smallest input that proves a program wrong, using cross-checked model-written oracles and real execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
refute = "refute.cli:main"

[tool.setuptools]
packages = ["refute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
